<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
<div class="card">
<div class="card-header">Edit User</div>
<div class="card-body">
    <a class="btn secondary" href="/admin/users">Back</a>
    <div class="spacer"></div>
    <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-row">
            <div class="form-col"><label>Username</label><input name="username" th:value="${user.username}" required></div>
            <div class="form-col"><label>New Password</label><input type="password" name="password" placeholder="Leave blank to keep"></div>
            <div class="form-col"><label>Enabled</label><input type="checkbox" name="enabled" th:checked="${user.enabled}"></div>
        </div>
        <div class="spacer"></div>
        <fieldset>
            <legend>Roles</legend>
            <label th:each="r: ${roles}"><input type="checkbox" name="roleIds" th:value="${r.id}" th:checked="${user.roles.contains(r)}"> <span th:text="${r.name}">ADMIN</span></label>
        </fieldset>
        <div class="spacer"></div>
        <input type="submit" value="Save">
    </form>
</div>
</div>
</div>
</body>
</html>
