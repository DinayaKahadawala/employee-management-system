<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Employee</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">Create Employee</div>
        <div class="card-body">
            <a class="btn secondary" href="/employee">Back to list</a>
            <div class="spacer"></div>
            <h3>Full-Time</h3>
            <form th:action="@{/employee/new/fulltime}" method="post" th:object="${fullTimeEmployee}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-row">
                    <div class="form-col"><label>First Name</label><input th:field="*{firstName}" placeholder="First Name" required></div>
                    <div class="form-col"><label>Last Name</label><input th:field="*{lastName}" placeholder="Last Name" required></div>
                    <div class="form-col"><label>Email</label><input th:field="*{email}" placeholder="Email" type="email" required></div>
                    <div class="form-col"><label>Phone</label><input th:field="*{phone}" placeholder="Phone" required></div>
                    <div class="form-col"><label>Department</label><input th:field="*{department}" placeholder="Department" required></div>
                    <div class="form-col"><label>Job Title</label><input th:field="*{jobTitle}" placeholder="Job Title" required></div>
                    <div class="form-col"><label>Annual Salary</label><input th:field="*{annualSalary}" placeholder="Annual Salary" type="number" step="0.01"></div>
                </div>
                <div class="spacer"></div>
                <input type="submit" value="Create Full-Time">
            </form>
            <div class="spacer"></div>
            <h3>Contract</h3>
            <form th:action="@{/employee/new/contract}" method="post" th:object="${contractEmployee}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-row">
                    <div class="form-col"><label>First Name</label><input th:field="*{firstName}" placeholder="First Name" required></div>
                    <div class="form-col"><label>Last Name</label><input th:field="*{lastName}" placeholder="Last Name" required></div>
                    <div class="form-col"><label>Email</label><input th:field="*{email}" placeholder="Email" type="email" required></div>
                    <div class="form-col"><label>Phone</label><input th:field="*{phone}" placeholder="Phone" required></div>
                    <div class="form-col"><label>Department</label><input th:field="*{department}" placeholder="Department" required></div>
                    <div class="form-col"><label>Job Title</label><input th:field="*{jobTitle}" placeholder="Job Title" required></div>
                    <div class="form-col"><label>Hourly Rate</label><input th:field="*{hourlyRate}" placeholder="Hourly Rate" type="number" step="0.01"></div>
                </div>
                <div class="spacer"></div>
                <input type="submit" value="Create Contract">
            </form>
        </div>
    </div>
    </div>

</body>
</html>
