<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
</head>
<body>
<div class="container">
<div class="card">
<div class="card-header">Users</div>
<div class="card-body">
    <div class="stack">
        <a class="btn secondary" href="/">Back to Dashboard</a>
        <a class="btn" href="/admin/users/new">Add User</a>
    </div>
    <div class="spacer"></div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Type</th>
                <th>Status</th>
                <th>Roles</th>
                <th>Last Login</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="u: ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">alice</td>
            <td>
                <span class="badge" 
                      th:style="'background: ' + (${u.userType == 'ADMIN'} ? '#ef4444' : (${u.userType == 'MANAGER'} ? '#3b82f6' : '#10b981')) + '; color: white;'"
                      th:text="${u.userType}">EMPLOYEE</span>
            </td>
            <td>
                <span th:if="${u.isActive()}" class="badge" style="background: #d1fae5; color: #065f46;">Active</span>
                <span th:if="${u.isAccountLocked()}" class="badge" style="background: #fef3c7; color: #92400e;">Locked</span>
                <span th:if="${!u.enabled}" class="badge" style="background: #fee2e2; color: #991b1b;">Disabled</span>
            </td>
            <td>
                <span th:each="r: ${u.roles}" th:text="${r.name}" class="badge" style="background: #e5e7eb; color: #374151; margin-right: 4px;">ROLE</span>
            </td>
            <td th:text="${u.lastLogin != null ? #temporals.format(u.lastLogin, 'yyyy-MM-dd HH:mm') : 'Never'}">2024-01-15 14:30</td>
            <td>
                <div class="stack">
                    <a class="btn" th:href="@{'/admin/users/' + ${u.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="submit" value="Delete" class="btn danger">
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="spacer"></div>
    <h3>Roles</h3>
    <form method="post" action="/admin/users/roles">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="text" name="name" placeholder="Role name" required>
        <input type="submit" value="Add Role">
    </form>
    <ul>
        <li th:each="r: ${roles}">
            <span th:text="${r.name}">ADMIN</span>
            <form th:action="@{'/admin/users/roles/' + ${r.id} + '/delete'}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" value="Delete" class="btn danger">
            </form>
        </li>
    </ul>
</div>
</div>
</div>
</body>
</html>
